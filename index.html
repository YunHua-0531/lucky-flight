<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lucky Flight｜學生 Miles 查詢</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                "Noto Sans TC",
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #eef5fb 0%,
                    #f8fbfd 100%
                );

            color: #333;

        }


        /* =========================
           Header
        ========================= */

        header {

            background:
                linear-gradient(
                    135deg,
                    #1e3a5f,
                    #4b7fa8
                );

            color: white;

            text-align: center;

            padding:
                32px
                20px
                28px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.12);

        }


        header h1 {

            margin: 0;

            font-size: 34px;

            letter-spacing: 1px;

        }


        header p {

            margin:
                8px
                0
                0;

            font-size: 16px;

            opacity: 0.9;

        }


        /* =========================
           主容器
        ========================= */

        .container {

            max-width: 1000px;

            margin:
                30px
                auto;

            padding:
                0
                20px;

        }


        /* =========================
           年級選擇
        ========================= */

        .grade-panel {

            background: white;

            border-radius: 18px;

            padding: 22px;

            margin-bottom: 25px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.07);

        }


        .grade-title {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        .grade-buttons {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

        }


        .grade-btn {

            flex: 1;

            min-width: 130px;

            padding:
                14px
                18px;

            border-radius: 12px;

            border:
                2px solid
                #d6e0e8;

            background: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition:
                0.2s;

        }


        .grade-btn:hover {

            transform:
                translateY(-2px);

        }


        .grade-btn.active {

            background:
                #1e3a5f;

            border-color:
                #1e3a5f;

            color: white;

        }


        /* =========================
           班級資訊
        ========================= */

        .class-info {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 18px;

        }


        .class-title {

            font-size: 25px;

            font-weight: bold;

        }


        .draw-rule {

            background:
                #fff7df;

            border:
                1px solid
                #f1d98a;

            color:
                #765a00;

            padding:
                8px
                13px;

            border-radius:
                20px;

            font-size:
                14px;

        }


        /* =========================
           學生表格
        ========================= */

        .student-table-wrapper {

            background: white;

            border-radius: 18px;

            overflow-x: auto;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.07);

        }


        table {

            width: 100%;

            border-collapse:
                collapse;

            min-width: 600px;

        }


        th {

            background:
                #edf3f8;

            color:
                #40566b;

            padding:
                15px
                12px;

            text-align: center;

            font-size:
                15px;

        }


        td {

            padding:
                16px
                12px;

            text-align: center;

            border-top:
                1px solid
                #edf0f2;

            font-size:
                16px;

        }


        tbody tr:hover {

            background:
                #f8fbfd;

        }


        .seat {

            font-weight: bold;

            color:
                #667;

        }


        .student-name {

            font-weight: bold;

            color:
                #333;

        }


        .miles {

            font-size:
                21px;

            font-weight: bold;

            color:
                #1e5d91;

        }


        .ticket {

            display:
                inline-block;

            background:
                #fff3d2;

            color:
                #9a6900;

            padding:
                5px
                10px;

            border-radius:
                15px;

            font-weight:
                bold;

        }


        .no-ticket {

            color:
                #aaa;

        }


        /* =========================
           載入／空資料
        ========================= */

        .message {

            background:
                white;

            border-radius:
                18px;

            padding:
                40px
                20px;

            text-align:
                center;

            color:
                #777;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.07);

        }


        /* =========================
           手機版
        ========================= */

        @media (
            max-width: 600px
        ) {

            header h1 {

                font-size:
                    28px;

            }


            .container {

                margin-top:
                    20px;

            }


            .class-title {

                font-size:
                    22px;

            }


            .grade-btn {

                min-width:
                    100px;

                font-size:
                    15px;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     Header
========================= -->

<header>

    <h1>
        ✈️ Lucky Flight
    </h1>

    <p>
        學生 Miles 航班資訊
    </p>

</header>


<!-- =========================
     主內容
========================= -->

<div class="container">


    <!-- 年級選擇 -->

    <section class="grade-panel">

        <div class="grade-title">

            🏫 請選擇年級

        </div>


        <div class="grade-buttons">

            <button
                class="grade-btn active"
                data-grade="3"
            >
                三年級
            </button>


            <button
                class="grade-btn"
                data-grade="4"
            >
                四年級
            </button>


            <button
                class="grade-btn"
                data-grade="6"
            >
                六年級
            </button>

        </div>

    </section>


    <!-- 班級資訊 -->

    <div class="class-info">

        <div
            class="class-title"
            id="classTitle"
        >
            三年級學生
        </div>


        <div
            class="draw-rule"
            id="drawRule"
        >
            🎫 30 Miles = 1 次抽獎
        </div>

    </div>


    <!-- 學生資料 -->

    <div
        id="studentArea"
    >

        <div class="message">

            正在載入學生資料……

        </div>

    </div>


</div>


<!-- =========================
     Firebase
========================= -->

<script type="module">


    /* =========================
       Firebase App
    ========================= */

    import {

        initializeApp

    }
    from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    /* =========================
       Firestore
    ========================= */

    import {

        getFirestore,

        collection,

        getDocs,

        onSnapshot

    }
    from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       Firebase 設定
    ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCF5oYAL83XW2Fa5hvdMYduKFj2gvDv1zA",

        authDomain:
            "lucke-flight.firebaseapp.com",

        projectId:
            "lucke-flight",

        storageBucket:
            "lucke-flight.firebasestorage.app",

        messagingSenderId:
            "682813117774",

        appId:
            "1:682813117774:web:ff379b46474d755d513a1f",

        measurementId:
            "G-45JZ9WENH9"

    };


    /* =========================
       初始化
    ========================= */

    const app =
        initializeApp(
            firebaseConfig
        );


    const db =
        getFirestore(app);


    /* =========================
       狀態
    ========================= */

    let currentGrade = 3;

    let students = [];


    /* =========================
       DOM
    ========================= */

    const studentArea =
        document.getElementById(
            "studentArea"
        );


    const classTitle =
        document.getElementById(
            "classTitle"
        );


    const drawRule =
        document.getElementById(
            "drawRule"
        );


    /* =========================
       抽獎門檻
    ========================= */

    function getDrawCost(
        grade
    ) {

        return Number(grade) === 6
            ? 80
            : 30;

    }


    /* =========================
       年級名稱
    ========================= */

    function getGradeName(
        grade
    ) {

        const names = {

            3: "三年級",

            4: "四年級",

            6: "六年級"

        };


        return (
            names[grade] ||
            `${grade} 年級`
        );

    }


    /* =========================
       顯示學生
    ========================= */

    function renderStudents() {

        const gradeStudents =
            students
                .filter(
                    student =>
                        Number(
                            student.grade
                        ) ===
                        currentGrade
                )
                .sort(
                    (a, b) =>
                        String(a.id)
                            .localeCompare(
                                String(b.id),
                                "zh-TW",
                                {
                                    numeric: true
                                }
                            )
                );


        const drawCost =
            getDrawCost(
                currentGrade
            );


        classTitle.textContent =
            `${getGradeName(currentGrade)}學生`;


        drawRule.textContent =
            `🎫 ${drawCost} Miles = 1 次抽獎`;


        if (
            gradeStudents.length === 0
        ) {

            studentArea.innerHTML = `

                <div class="message">

                    目前沒有
                    ${getGradeName(currentGrade)}
                    的學生資料。

                </div>

            `;

            return;

        }


        studentArea.innerHTML = `

            <div
                class="student-table-wrapper"
            >

                <table>

                    <thead>

                        <tr>

                            <th>
                                座號
                            </th>

                            <th>
                                姓名
                            </th>

                            <th>
                                ✈️ Miles
                            </th>

                            <th>
                                🎫 可抽獎
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${gradeStudents
                            .map(
                                student => {

                                    const miles =
                                        Number(
                                            student.miles ||
                                            0
                                        );


                                    const tickets =
                                        Math.floor(
                                            miles /
                                            drawCost
                                        );


                                    return `

                                        <tr>

                                            <td
                                                class="seat"
                                            >
                                                ${student.id}
                                            </td>


                                            <td
                                                class="student-name"
                                            >
                                                ${student.name}
                                            </td>


                                            <td
                                                class="miles"
                                            >
                                                ${miles}
                                            </td>


                                            <td>

                                                ${
                                                    tickets > 0

                                                    ?

                                                    `
                                                        <span
                                                            class="ticket"
                                                        >
                                                            🎫
                                                            ${tickets}
                                                            次
                                                        </span>
                                                    `

                                                    :

                                                    `
                                                        <span
                                                            class="no-ticket"
                                                        >
                                                            0 次
                                                        </span>
                                                    `
                                                }

                                            </td>

                                        </tr>

                                    `;

                                }
                            )
                            .join("")}

                    </tbody>

                </table>

            </div>

        `;

    }


    /* =========================
       年級按鈕
    ========================= */

    document
        .querySelectorAll(
            ".grade-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        currentGrade =
                            Number(
                                button.dataset.grade
                            );


                        document
                            .querySelectorAll(
                                ".grade-btn"
                            )
                            .forEach(
                                btn => {

                                    btn.classList
                                        .remove(
                                            "active"
                                        );

                                }
                            );


                        button.classList
                            .add(
                                "active"
                            );


                        renderStudents();

                    }
                );

            }
        );


    /* =========================
       即時讀取 Firestore
    ========================= */

    onSnapshot(
        collection(
            db,
            "students"
        ),

        snapshot => {

            students =
                snapshot.docs.map(
                    docSnap => {

                        const data =
                            docSnap.data();


                        return {

                            firestoreId:
                                docSnap.id,

                            id:
                                data.studentId,

                            name:
                                data.name,

                            grade:
                                data.grade,

                            miles:
                                data.miles || 0

                        };

                    }
                );


            renderStudents();

        },

        error => {

            console.error(
                "Firestore 讀取錯誤：",
                error
            );


            studentArea.innerHTML = `

                <div class="message">

                    ❌ 目前無法讀取學生資料。<br><br>

                    請稍後再試。

                </div>

            `;

        }

    );

</script>


</body>

</html>
