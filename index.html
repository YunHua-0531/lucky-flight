<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>✈️ Lucky Flight 幸運航班</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    background:#f4f7fb;
    color:#243447;
}

/* =========================
   Header
========================= */

header{
    background:linear-gradient(
        135deg,
        #182848,
        #4b6cb7
    );
    color:white;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
    opacity:.9;
}

/* =========================
   Main
========================= */

.container{
    max-width:1000px;
    margin:auto;
    padding:25px 18px;
}

/* =========================
   Grade Selection
========================= */

.grade-title{
    text-align:center;
    margin:10px 0 20px;
}

.grade-buttons{
    display:flex;
    gap:12px;
    margin-bottom:25px;
}

.grade-buttons button{
    flex:1;
    border:none;
    padding:15px 10px;
    border-radius:15px;
    background:white;
    color:#243447;
    cursor:pointer;
    font-size:17px;
    box-shadow:0 3px 10px rgba(0,0,0,.06);
    transition:.2s;
}

.grade-buttons button:hover{
    transform:translateY(-2px);
}

.grade-buttons button.active{
    background:#4b6cb7;
    color:white;
}

/* =========================
   Rule
========================= */

.rule-box{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:22px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.rule-box strong{
    color:#4b6cb7;
    font-size:20px;
}

/* =========================
   Student Table
========================= */

.table-box{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#eef2f7;
}

th,
td{
    padding:15px 12px;
    text-align:center;
    border-bottom:1px solid #eee;
}

th{
    font-weight:600;
}

tbody tr:last-child td{
    border-bottom:none;
}

.student-name{
    font-weight:bold;
}

.miles{
    font-size:22px;
    font-weight:bold;
    color:#4b6cb7;
}

.ticket{
    font-weight:bold;
}

.ticket.ready{
    color:#237a42;
}

.ticket.none{
    color:#999;
}

/* =========================
   Empty
========================= */

.empty{
    text-align:center;
    padding:50px 20px;
    color:#888;
}

/* =========================
   Footer
========================= */

footer{
    text-align:center;
    padding:25px;
    color:#999;
    font-size:13px;
}

/* =========================
   Mobile
========================= */

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    .container{
        padding:20px 12px;
    }

    .grade-buttons{
        gap:7px;
    }

    .grade-buttons button{
        font-size:15px;
        padding:13px 5px;
    }

    th,
    td{
        padding:12px 5px;
        font-size:14px;
    }

    .miles{
        font-size:19px;
    }

}

</style>

</head>

<body>


<header>

    <h1>✈️ Lucky Flight</h1>

    <p>
        幸運航班｜智慧座艙
    </p>

</header>


<div class="container">

    <h2 class="grade-title">
        🎓 選擇你的年級
    </h2>


    <div class="grade-buttons">

        <button
            id="grade3Btn"
            onclick="setGrade(3)">

            三年級

        </button>


        <button
            id="grade4Btn"
            onclick="setGrade(4)">

            四年級

        </button>


        <button
            id="grade6Btn"
            onclick="setGrade(6)">

            六年級

        </button>

    </div>


    <div class="rule-box">

        <div>
            <span id="gradeName">
                三年級
            </span>
        </div>

        <div style="margin-top:6px;">

            🎫 每
            <strong id="threshold">
                30
            </strong>
            Miles 可抽獎 1 次

        </div>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>
                        座號
                    </th>

                    <th>
                        學生
                    </th>

                    <th>
                        Miles
                    </th>

                    <th>
                        可抽獎
                    </th>

                </tr>

            </thead>


            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

</div>


<footer>

    ✈️ Lucky Flight 幸運航班

</footer>


<script>

/* =====================================================
   年級規則
===================================================== */

const gradeRules = {

    3:{
        name:"三年級",
        threshold:30
    },

    4:{
        name:"四年級",
        threshold:30
    },

    6:{
        name:"六年級",
        threshold:80
    }

};


/* =====================================================
   目前選擇年級
===================================================== */

let currentGrade = 3;


/* =====================================================
   讀取學生資料
===================================================== */

function getStudents(){

    return JSON.parse(
        localStorage.getItem(
            "luckyFlightStudentsV2"
        )
    ) || [];

}


/* =====================================================
   計算抽獎次數
===================================================== */

function getTickets(student){

    const threshold =
        gradeRules[
            student.grade
        ].threshold;

    return Math.floor(
        student.miles / threshold
    );

}


/* =====================================================
   切換年級
===================================================== */

function setGrade(grade){

    currentGrade = grade;


    document
        .querySelectorAll(
            ".grade-buttons button"
        )
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });


    document
        .getElementById(
            "grade" + grade + "Btn"
        )
        .classList.add("active");


    document.getElementById(
        "gradeName"
    ).textContent =
        gradeRules[grade].name;


    document.getElementById(
        "threshold"
    ).textContent =
        gradeRules[grade].threshold;


    renderStudents();

}


/* =====================================================
   顯示學生
===================================================== */

function renderStudents(){

    const table =
        document.getElementById(
            "studentTable"
        );


    const students =
        getStudents()
            .filter(
                student =>
                    student.grade === currentGrade
            );


    if(students.length === 0){

        table.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty">

                    目前這個年級還沒有學生資料。

                </td>

            </tr>

        `;

        return;

    }


    table.innerHTML =
        students
            .sort(
                (a,b) =>
                    a.id.localeCompare(
                        b.id,
                        undefined,
                        {
                            numeric:true
                        }
                    )
            )
            .map(student => {

                const tickets =
                    getTickets(student);


                const ticketClass =
                    tickets > 0
                    ? "ready"
                    : "none";


                return `

                    <tr>

                        <td>
                            ${student.id}
                        </td>

                        <td
                            class="student-name">

                            ${student.name}

                        </td>

                        <td
                            class="miles">

                            ${student.miles}

                        </td>

                        <td
                            class="
                            ticket
                            ${ticketClass}
                            ">

                            🎫 ${tickets} 次

                        </td>

                    </tr>

                `;

            })
            .join("");

}


/* =====================================================
   初始化
===================================================== */

setGrade(3);


/*
   每 5 秒重新讀取一次資料。
   老師在後台修改 Miles 後，
   學生前台會自動更新。
*/

setInterval(
    renderStudents,
    5000
);

</script>

</body>
</html>
