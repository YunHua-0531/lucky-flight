<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Flight 教師管理</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans TC", sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #1e3a5f, #3f6f9f);
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* =========================
           登入
        ========================= */

        #loginSection {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        #loginSection h2 {
            text-align: center;
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loginBtn {
            width: 100%;
            background: #1e3a5f;
            color: white;
            margin-top: 10px;
        }

        #loginMessage {
            color: #d33;
            text-align: center;
            margin-top: 12px;
        }

        /* =========================
           後台
        ========================= */

        #dashboard {
            display: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .logout-btn {
            background: #777;
            color: white;
        }

        /* =========================
           年級
        ========================= */

        .grade-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .grade-btn {
            background: white;
            border: 2px solid #d5dce5;
        }

        .grade-btn.active {
            background: #1e3a5f;
            color: white;
            border-color: #1e3a5f;
        }

        /* =========================
           搜尋
        ========================= */

        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-area input {
            margin: 0;
        }

        .add-btn {
            background: #2d8a57;
            color: white;
            white-space: nowrap;
        }

        /* =========================
           學生卡片
        ========================= */

        #studentList {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(280px, 1fr)
            );
            gap: 18px;
        }

        .student-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .student-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .student-info {
            color: #777;
            margin-bottom: 15px;
        }

        .miles {
            font-size: 28px;
            font-weight: bold;
            color: #1e5d91;
            margin-bottom: 5px;
        }

        .tickets {
            margin-bottom: 15px;
            color: #555;
        }

        .card-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .plus-btn {
            background: #4caf50;
            color: white;
        }

        .minus-btn {
            background: #e57373;
            color: white;
        }

        .draw-btn {
            background: #f0a500;
            color: white;
        }

        .history-btn {
            background: #607d8b;
            color: white;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        /* =========================
           Modal
        ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,0.45);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            padding: 25px;
        }

        .modal-content h3 {
            margin-top: 0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .cancel-btn {
            background: #ddd;
        }

        .confirm-btn {
            background: #1e3a5f;
            color: white;
        }
    </style>
</head>

<body>

<!-- =========================
     頁首
========================= -->

<header>

    <h1>✈️ Lucky Flight</h1>

    <p>
        👩‍🏫 教師智慧座艙
    </p>

</header>


<!-- =========================
     教師登入
========================= -->

<section id="loginSection">

    <h2>教師登入</h2>

    <input
        type="email"
        id="email"
        placeholder="電子郵件地址"
    >

    <input
        type="password"
        id="password"
        placeholder="密碼"
    >

    <button id="loginBtn">
        登入
    </button>

    <div id="loginMessage"></div>

</section>


<!-- =========================
     教師後台
========================= -->

<div id="dashboard">

    <div class="container">

        <!-- 上方資訊 -->

        <div class="top-bar">

            <div>

                <h2>
                    教師智慧座艙
                </h2>

                <div id="teacherEmail"></div>

            </div>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                登出
            </button>

        </div>


        <!-- =========================
             年級選擇
        ========================= -->

        <div class="grade-buttons">

            <button
                class="grade-btn"
                data-grade="3"
            >
                三年級
            </button>

            <button
                class="grade-btn"
                data-grade="4"
            >
                四年級
            </button>

            <button
                class="grade-btn"
                data-grade="6"
            >
                六年級
            </button>

        </div>


        <!-- =========================
             搜尋
        ========================= -->

        <div class="search-area">

            <input
                type="text"
                id="searchInput"
                placeholder="搜尋學生姓名或座號"
            >

            <button
                class="add-btn"
                id="addStudentBtn"
            >
                ＋ 新增學生
            </button>

        </div>


        <!-- =========================
             學生列表
        ========================= -->

        <div id="studentList">

            <div class="loading">
                正在讀取學生資料……
            </div>

        </div>

    </div>

</div>


<!-- =========================
     Miles Modal
========================= -->

<div
    class="modal"
    id="milesModal"
>

    <div class="modal-content">

        <h3 id="milesModalTitle">
            增加 Miles
        </h3>

        <input
            type="number"
            id="milesInput"
            placeholder="請輸入 Miles"
            min="1"
        >

        <div class="modal-buttons">

            <button
                class="cancel-btn"
                id="cancelMilesBtn"
            >
                取消
            </button>

            <button
                class="confirm-btn"
                id="confirmMilesBtn"
            >
                確定
            </button>

        </div>

    </div>

</div>


<!-- =========================
     Firebase
========================= -->

<script type="module">

    /* =========================
       Firebase App
    ========================= */

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    /* =========================
       Firebase Authentication
    ========================= */

    import {
        getAuth,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =========================
       Firebase Firestore
    ========================= */

    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        updateDoc,
        increment
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       Firebase 設定
    ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCF5oYAL83XW2Fa5hvdMYduKFj2gvDv1zA",

        authDomain:
            "lucke-flight.firebaseapp.com",

        projectId:
            "lucke-flight",

        storageBucket:
            "lucke-flight.firebasestorage.app",

        messagingSenderId:
            "682813117774",

        appId:
            "1:682813117774:web:ff379b46474d755d513a1f",

        measurementId:
            "G-45JZ9WENH9"

    };


    /* =========================
       初始化 Firebase
    ========================= */

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    /* =========================
       網站變數
    ========================= */

    let students = [];

    let currentGrade = 3;

    let currentSearch = "";

    let selectedStudent = null;

    let milesMode = "plus";


    /* =========================
       DOM 元件
    ========================= */

    const loginSection =
        document.getElementById(
            "loginSection"
        );


    const dashboard =
        document.getElementById(
            "dashboard"
        );


    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    const logoutBtn =
        document.getElementById(
            "logoutBtn"
        );


    const loginMessage =
        document.getElementById(
            "loginMessage"
        );


    const teacherEmail =
        document.getElementById(
            "teacherEmail"
        );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const studentList =
        document.getElementById(
            "studentList"
        );


    const milesModal =
        document.getElementById(
            "milesModal"
        );


    const milesInput =
        document.getElementById(
            "milesInput"
        );


    const confirmMilesBtn =
        document.getElementById(
            "confirmMilesBtn"
        );


    const cancelMilesBtn =
        document.getElementById(
            "cancelMilesBtn"
        );


    /* =========================
       教師登入
    ========================= */

    loginBtn.addEventListener(
        "click",
        async () => {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            if (
                !email ||
                !password
            ) {

                loginMessage.textContent =
                    "請輸入電子郵件與密碼。";

                return;

            }


            try {

                loginMessage.textContent =
                    "登入中……";


                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                loginMessage.textContent =
                    "";


            }
            catch (error) {

                console.error(error);

                loginMessage.textContent =
                    "登入失敗，請確認帳號與密碼。";

            }

        }
    );


    /* =========================
       登出
    ========================= */

    logoutBtn.addEventListener(
        "click",
        async () => {

            await signOut(auth);

        }
    );


    /* =========================
       Firebase 登入狀態
    ========================= */

    onAuthStateChanged(
        auth,
        async user => {

            if (user) {

                loginSection.style.display =
                    "none";


                dashboard.style.display =
                    "block";


                teacherEmail.textContent =
                    "目前登入：" +
                    user.email;


                /*
                 * 登入成功後
                 * 從 Firestore 讀取學生
                 */

                await loadStudentsFromFirestore();


            }
            else {

                loginSection.style.display =
                    "block";


                dashboard.style.display =
                    "none";

            }

        }
    );


    /* =========================
       從 Firestore 讀取學生
    ========================= */

    async function loadStudentsFromFirestore() {

        studentList.innerHTML = `

            <div class="loading">

                正在從 Firebase
                讀取學生資料……

            </div>

        `;


        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "students"
                    )
                );


            students =
                snapshot.docs.map(
                    docSnap => {

                        const data =
                            docSnap.data();


                        return {

                            /*
                             * Firestore 文件 ID
                             */

                            firestoreId:
                                docSnap.id,


                            /*
                             * 網站使用的學生資料
                             */

                            id:
                                data.studentId,


                            name:
                                data.name,


                            grade:
                                data.grade,


                            miles:
                                data.miles || 0,


                            history:
                                data.history || []

                        };

                    }
                );


            console.log(
                "Firestore 學生資料：",
                students
            );


            renderStudents();


        }
        catch (error) {

            console.error(
                "Firestore 讀取錯誤：",
                error
            );


            studentList.innerHTML = `

                <div class="empty">

                    ❌ 讀取 Firestore
                    學生資料失敗

                </div>

            `;

        }

    }


    /* =========================
       年級切換
    ========================= */

    document
        .querySelectorAll(".grade-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    currentGrade =
                        Number(
                            button.dataset.grade
                        );


                    document
                        .querySelectorAll(
                            ".grade-btn"
                        )
                        .forEach(btn => {

                            btn.classList.remove(
                                "active"
                            );

                        });


                    button.classList.add(
                        "active"
                    );


                    renderStudents();

                }
            );

        });


    /* =========================
       搜尋學生
    ========================= */

    searchInput.addEventListener(
        "input",
        () => {

            currentSearch =
                searchInput.value
                    .trim()
                    .toLowerCase();


            renderStudents();

        }
    );


    /* =========================
       顯示學生
    ========================= */

    function renderStudents() {

        const filteredStudents =
            students.filter(
                student => {

                    /*
                     * 年級符合
                     */

                    const sameGrade =
                        Number(
                            student.grade
                        ) ===
                        currentGrade;


                    /*
                     * 搜尋符合
                     */

                    const keyword =
                        currentSearch;


                    const matchSearch =
                        !keyword ||

                        String(
                            student.id || ""
                        )
                        .toLowerCase()
                        .includes(
                            keyword
                        ) ||

                        String(
                            student.name || ""
                        )
                        .toLowerCase()
                        .includes(
                            keyword
                        );


                    return (
                        sameGrade &&
                        matchSearch
                    );

                }
            );


        /*
         * 沒有學生
         */

        if (
            filteredStudents.length === 0
        ) {

            studentList.innerHTML = `

                <div class="empty">

                    目前沒有符合條件的學生。

                </div>

            `;

            return;

        }


        /*
         * 建立學生卡片
         */

        studentList.innerHTML =
            filteredStudents
                .map(
                    student => {

                        /*
                         * 抽獎所需 Miles
                         *
                         * 三、四年級：30
                         * 六年級：80
                         */

                        const drawCost =
                            currentGrade === 6
                                ? 80
                                : 30;


                        /*
                         * 計算目前可以抽幾次
                         */

                        const tickets =
                            Math.floor(
                                student.miles /
                                drawCost
                            );


                        return `

                            <div
                                class="student-card"
                            >

                                <div
                                    class="student-name"
                                >

                                    ${student.name}

                                </div>


                                <div
                                    class="student-info"
                                >

                                    座號：
                                    ${student.id}

                                </div>


                                <div
                                    class="miles"
                                >

                                    ${student.miles}
                                    Miles

                                </div>


                                <div
                                    class="tickets"
                                >

                                    🎫 可抽獎
                                    ${tickets}
                                    次

                                </div>


                                <div
                                    class="card-buttons"
                                >

                                    <button
                                        class="plus-btn"
                                        data-action="plus"
                                        data-id="${student.firestoreId}"
                                    >

                                        ＋ Miles

                                    </button>


                                    <button
                                        class="minus-btn"
                                        data-action="minus"
                                        data-id="${student.firestoreId}"
                                    >

                                        − Miles

                                    </button>


                                    <button
                                        class="draw-btn"
                                        data-action="draw"
                                        data-id="${student.firestoreId}"
                                    >

                                        🎫 使用一次

                                    </button>


                                    <button
                                        class="history-btn"
                                        data-action="history"
                                        data-id="${student.firestoreId}"
                                    >

                                        📋 紀錄

                                    </button>

                                </div>

                            </div>

                        `;

                    }
                )
                .join("");


        /*
         * 綁定學生卡片按鈕
         */

        studentList
            .querySelectorAll("button")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const action =
                            button.dataset.action;


                        const firestoreId =
                            button.dataset.id;


                        /*
                         * ＋ Miles
                         */

                        if (
                            action === "plus"
                        ) {

                            openMilesModal(
                                firestoreId,
                                "plus"
                            );

                        }


                        /*
                         * − Miles
                         */

                        else if (
                            action === "minus"
                        ) {

                            openMilesModal(
                                firestoreId,
                                "minus"
                            );

                        }


                        /*
                         * 其他功能
                         */

                        else {

                            alert(
                                "這個功能下一階段再接上 Firebase。"
                            );

                        }

                    }
                );

            });

    }


    /* =========================
       開啟 Miles 視窗
    ========================= */

    function openMilesModal(
        firestoreId,
        mode
    ) {

        /*
         * 找學生
         */

        selectedStudent =
            students.find(
                student =>
                    student.firestoreId ===
                    firestoreId
            );


        if (
            !selectedStudent
        ) {

            return;

        }


        /*
         * 記錄目前是增加還是扣除
         */

        milesMode =
            mode;


        /*
         * 修改視窗標題
         */

        if (
            mode === "plus"
        ) {

            document.getElementById(
                "milesModalTitle"
            ).textContent =

                `增加 Miles｜${selectedStudent.name}`;

        }
        else {

            document.getElementById(
                "milesModalTitle"
            ).textContent =

                `扣除 Miles｜${selectedStudent.name}`;

        }


        /*
         * 清空輸入
         */

        milesInput.value =
            "";


        /*
         * 顯示視窗
         */

        milesModal.style.display =
            "flex";


        /*
         * 自動選取輸入框
         */

        milesInput.focus();

    }


    /* =========================
       關閉 Miles 視窗
    ========================= */

    cancelMilesBtn.addEventListener(
        "click",
        () => {

            milesModal.style.display =
                "none";


            selectedStudent =
                null;

        }
    );


    /* =========================
       確定增加／扣除 Miles
    ========================= */

    confirmMilesBtn.addEventListener(
        "click",
        async () => {

            /*
             * 確認是否有學生
             */

            if (
                !selectedStudent
            ) {

                return;

            }


            /*
             * 取得輸入數字
             */

            const amount =
                Number(
                    milesInput.value
                );


            /*
             * 檢查輸入
             */

            if (
                !Number.isFinite(
                    amount
                ) ||
                amount <= 0
            ) {

                alert(
                    "請輸入大於 0 的 Miles。"
                );

                return;

            }


            /*
             * 如果是扣除 Miles
             * 先確認餘額
             */

            if (
                milesMode === "minus" &&
                amount >
                    selectedStudent.miles
            ) {

                alert(

                    `目前只有 ${selectedStudent.miles} Miles，` +
                    `無法扣除 ${amount} Miles。`

                );

                return;

            }


            try {

                /*
                 * 暫時停用按鈕
                 */

                confirmMilesBtn.disabled =
                    true;


                confirmMilesBtn.textContent =
                    "儲存中……";


                /*
                 * 找到 Firestore 文件
                 */

                const studentRef =
                    doc(
                        db,
                        "students",
                        selectedStudent.firestoreId
                    );


                /*
                 * 判斷增加還是扣除
                 */

                const change =
                    milesMode === "plus"
                        ? amount
                        : -amount;


                /*
                 * 更新 Firestore
                 */

                await updateDoc(
                    studentRef,
                    {

                        miles:
                            increment(
                                change
                            )

                    }
                );


                /*
                 * 關閉視窗
                 */

                milesModal.style.display =
                    "none";


                selectedStudent =
                    null;


                /*
                 * 重新從 Firestore 讀取
                 */

                await loadStudentsFromFirestore();


                /*
                 * 成功提示
                 */

                alert(
                    "✅ Miles 已成功更新！"
                );


            }
            catch (error) {

                console.error(
                    "Miles 更新失敗：",
                    error
                );


                alert(
                    "❌ Miles 更新失敗，請查看瀏覽器主控台。"
                );

            }
            finally {

                confirmMilesBtn.disabled =
                    false;


                confirmMilesBtn.textContent =
                    "確定";

            }

        }
    );


    /* =========================
       初始年級
    ========================= */

    document
        .querySelector(
            '[data-grade="3"]'
        )
        .classList.add(
            "active"
        );

</script>

</body>
</html>
