<script type="module">

/* =====================================================
   Firebase
===================================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCF5oYAL83XW2Fa5hvdMYduKFj2gvDv1zA",

    authDomain:
        "lucke-flight.firebaseapp.com",

    projectId:
        "lucke-flight",

    storageBucket:
        "lucke-flight.firebasestorage.app",

    messagingSenderId:
        "682813117774",

    appId:
        "1:682813117774:web:ff379b46474d755d513a1f",

    measurementId:
        "G-45JZ9WENH9"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


/* =====================================================
   基本設定
===================================================== */

const gradeRules = {

    3:{
        name:"三年級",
        threshold:30
    },

    4:{
        name:"四年級",
        threshold:30
    },

    6:{
        name:"六年級",
        threshold:80
    }

};


let students =
    JSON.parse(
        localStorage.getItem(
            "luckyFlightStudentsV2"
        )
    ) || [];


let currentGrade = 3;

let currentMilesStudentId = null;

let currentMilesAction = null;


/* =====================================================
   儲存
===================================================== */

function saveStudents(){

    localStorage.setItem(
        "luckyFlightStudentsV2",
        JSON.stringify(students)
    );

}


/* =====================================================
   初始化測試資料
===================================================== */

function init(){

    if(students.length === 0){

        students = [

            {
                id:"01",
                name:"王小明",
                grade:3,
                miles:25,
                history:[]
            },

            {
                id:"02",
                name:"林小華",
                grade:4,
                miles:45,
                history:[]
            },

            {
                id:"03",
                name:"陳小美",
                grade:6,
                miles:100,
                history:[]
            }

        ];

        saveStudents();

    }

    setGrade(3);

}


/* =====================================================
   Firebase 登入
===================================================== */

async function teacherLogin(){

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;


    if(!email || !password){

        alert(
            "請輸入教師 Email 與密碼。"
        );

        return;

    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }

    catch(error){

        console.error(
            "Firebase Login Error:",
            error
        );

        alert(
            "登入失敗，請確認 Email 與密碼。"
        );

    }

}


/* =====================================================
   Firebase 登入狀態
===================================================== */

onAuthStateChanged(
    auth,
    user => {

        if(user){

            document
                .getElementById(
                    "loginBox"
                )
                .style.display = "none";


            document
                .getElementById(
                    "dashboard"
                )
                .style.display = "block";


            renderStudents();

        }

        else{

            document
                .getElementById(
                    "loginBox"
                )
                .style.display = "block";


            document
                .getElementById(
                    "dashboard"
                )
                .style.display = "none";

        }

    }
);


/* =====================================================
   登出
===================================================== */

async function teacherLogout(){

    try{

        await signOut(auth);

    }

    catch(error){

        console.error(error);

    }

}


/* =====================================================
   年級
===================================================== */

function setGrade(grade){

    currentGrade = grade;


    document
        .querySelectorAll(
            ".grade-buttons button"
        )
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });


    document
        .getElementById(
            "grade" + grade + "Btn"
        )
        .classList.add("active");


    renderStudents();

}


/* =====================================================
   Tickets
===================================================== */

function getTickets(student){

    const threshold =
        gradeRules[
            student.grade
        ].threshold;


    return Math.floor(
        student.miles / threshold
    );

}


/* =====================================================
   Render
===================================================== */

function renderStudents(){

    const grid =
        document.getElementById(
            "studentGrid"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    const filtered =
        students
            .filter(student => {

                if(
                    student.grade !==
                    currentGrade
                ){

                    return false;

                }


                if(!search){

                    return true;

                }


                return (
                    student.name
                        .toLowerCase()
                        .includes(search)
                    ||
                    student.id
                        .toLowerCase()
                        .includes(search)
                );

            })
            .sort(
                (a,b) =>
                    a.id.localeCompare(
                        b.id,
                        undefined,
                        {
                            numeric:true
                        }
                    )
            );


    if(filtered.length === 0){

        grid.innerHTML = `

            <div class="empty">

                目前沒有符合條件的學生。

            </div>

        `;

        return;

    }


    grid.innerHTML =
        filtered
            .map(student => {

                const tickets =
                    getTickets(student);


                const threshold =
                    gradeRules[
                        student.grade
                    ].threshold;


                return `

                    <div
                        class="student-card">

                        <div
                            class="student-top">

                            <div>

                                <div
                                    class="student-name">

                                    ${student.name}

                                </div>

                                <div
                                    class="student-grade">

                                    ${gradeRules[
                                        student.grade
                                    ].name}

                                    ｜座號
                                    ${student.id}

                                </div>

                            </div>

                        </div>


                        <div
                            class="miles">

                            ${student.miles}

                        </div>


                        <div
                            class="miles-label">

                            Miles

                        </div>


                        <div
                            class="ticket">

                            🎫 可抽獎

                            <strong>
                                ${tickets}
                            </strong>

                            次

                            <div
                                style="
                                font-size:12px;
                                color:#888;
                                margin-top:4px;
                                ">

                                ${threshold}
                                Miles／次

                            </div>

                        </div>


                        <div
                            class="card-buttons">

                            <button
                                class="add-btn"
                                data-action="add"
                                data-id="${student.id}">

                                ＋ Miles

                            </button>


                            <button
                                class="minus-btn"
                                data-action="minus"
                                data-id="${student.id}">

                                − Miles

                            </button>


                            <button
                                class="use-btn"
                                data-action="ticket"
                                data-id="${student.id}">

                                🎫 使用一次

                            </button>


                            <button
                                class="history-btn"
                                data-action="history"
                                data-id="${student.id}">

                                📖 飛行紀錄

                            </button>

                        </div>

                    </div>

                `;

            })
            .join("");

}


/* =====================================================
   Miles Modal
===================================================== */

function openMilesModal(
    studentId,
    action
){

    const student =
        students.find(
            s => s.id === studentId
        );


    if(!student) return;


    currentMilesStudentId =
        studentId;


    currentMilesAction =
        action;


    const select =
        document.getElementById(
            "mileAmount"
        );


    const customInput =
        document.getElementById(
            "customMiles"
        );


    const sign =
        action === "add"
        ? "＋"
        : "−";


    select.innerHTML = `

        <option value="1">
            ${sign}1 Mile
        </option>

        <option value="2">
            ${sign}2 Miles
        </option>

        <option value="3">
            ${sign}3 Miles
        </option>

        <option value="5">
            ${sign}5 Miles
        </option>

        <option value="10">
            ${sign}10 Miles
        </option>

        <option value="custom">
            自訂 Miles
        </option>

    `;


    customInput.value = "";

    customInput.style.display =
        "none";


    select.onchange = function(){

        customInput.style.display =
            this.value === "custom"
            ? "block"
            : "none";

    };


    document.getElementById(
        "milesModalTitle"
    ).textContent =
        action === "add"
        ? "＋ 增加 Miles"
        : "− 扣除 Miles";


    document.getElementById(
        "milesModalStudent"
    ).textContent =
        `${student.name}｜目前 ${student.miles} Miles`;


    document
        .getElementById(
            "milesModal"
        )
        .classList.add("show");

}


/* =====================================================
   Confirm Miles
===================================================== */

function confirmMiles(){

    const student =
        students.find(
            s => s.id === currentMilesStudentId
        );


    if(!student) return;


    const select =
        document.getElementById(
            "mileAmount"
        );


    let amount;


    if(select.value === "custom"){

        amount =
            Number(
                document.getElementById(
                    "customMiles"
                ).value
            );


        if(
            !Number.isInteger(amount) ||
            amount <= 0
        ){

            alert(
                "請輸入大於 0 的整數 Miles。"
            );

            return;

        }

    }

    else{

        amount =
            Number(select.value);

    }


    if(
        currentMilesAction ===
        "add"
    ){

        student.miles += amount;


        student.history.unshift({

            type:"➕ 增加 Miles",

            amount:amount,

            date:new Date()
                .toLocaleString(
                    "zh-TW"
                )

        });

    }

    else{

        if(student.miles < amount){

            alert(
                "Miles 不足，無法扣除。"
            );

            return;

        }


        student.miles -= amount;


        student.history.unshift({

            type:"➖ 扣除 Miles",

            amount:-amount,

            date:new Date()
                .toLocaleString(
                    "zh-TW"
                )

        });

    }


    saveStudents();

    closeModal(
        "milesModal"
    );

    renderStudents();

}


/* =====================================================
   使用一次抽獎
===================================================== */

function useTicket(studentId){

    const student =
        students.find(
            s => s.id === studentId
        );


    if(!student) return;


    const threshold =
        gradeRules[
            student.grade
        ].threshold;


    const tickets =
        getTickets(student);


    if(tickets <= 0){

        alert(
            `目前還不能抽獎。\n需要 ${threshold} Miles 才能抽一次。`
        );

        return;

    }


    const ok =
        confirm(
            `確定要讓 ${student.name} 使用一次實體抽獎嗎？\n\n將扣除 ${threshold} Miles。`
        );


    if(!ok) return;


    student.miles -= threshold;


    student.history.unshift({

        type:"🎫 實體抽獎",

        amount:-threshold,

        date:new Date()
            .toLocaleString(
                "zh-TW"
            )

    });


    saveStudents();

    renderStudents();

}


/* =====================================================
   新增學生
===================================================== */

function openAddStudentModal(){

    document.getElementById(
        "newStudentId"
    ).value = "";


    document.getElementById(
        "newStudentName"
    ).value = "";


    document.getElementById(
        "newStudentGrade"
    ).value =
        currentGrade;


    document
        .getElementById(
            "addStudentModal"
        )
        .classList.add("show");

}


function addStudent(){

    const id =
        document.getElementById(
            "newStudentId"
        ).value.trim();


    const name =
        document.getElementById(
            "newStudentName"
        ).value.trim();


    const grade =
        Number(
            document.getElementById(
                "newStudentGrade"
            ).value
        );


    if(!id || !name){

        alert(
            "請輸入座號與學生姓名。"
        );

        return;

    }


    const exists =
        students.some(
            student =>
                student.grade === grade &&
                student.id === id
        );


    if(exists){

        alert(
            "這個年級已經有相同座號的學生。"
        );

        return;

    }


    students.push({

        id:id,

        name:name,

        grade:grade,

        miles:0,

        history:[]

    });


    saveStudents();

    closeModal(
        "addStudentModal"
    );

    setGrade(grade);

}


/* =====================================================
   歷史紀錄
===================================================== */

function openHistory(studentId){

    const student =
        students.find(
            s => s.id === studentId
        );


    if(!student) return;


    document.getElementById(
        "historyTitle"
    ).textContent =
        `📖 ${student.name} 的飛行紀錄`;


    const content =
        document.getElementById(
            "historyContent"
        );


    if(
        !student.history ||
        student.history.length === 0
    ){

        content.innerHTML = `

            <div class="empty">

                目前還沒有紀錄。

            </div>

        `;

    }

    else{

        content.innerHTML =
            student.history
                .map(item => {

                    const amountText =
                        item.amount > 0
                        ? `+${item.amount} Miles`
                        : `${item.amount} Miles`;


                    return `

                        <div
                            class="history-item">

                            <div>
                                ${item.type}
                            </div>

                            <div
                                class="history-mile">

                                ${amountText}

                            </div>

                            <div
                                class="history-date">

                                ${item.date}

                            </div>

                        </div>

                    `;

                })
                .join("");

    }


    document
        .getElementById(
            "historyModal"
        )
        .classList.add("show");

}
