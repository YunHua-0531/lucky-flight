<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lucky Flight 教師管理</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans TC", sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #1e3a5f, #3f6f9f);
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* =========================
           登入
        ========================= */

        #loginSection {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        #loginSection h2 {
            text-align: center;
            margin-top: 0;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loginBtn {
            width: 100%;
            background: #1e3a5f;
            color: white;
            margin-top: 10px;
        }

        #loginMessage {
            color: #d33;
            text-align: center;
            margin-top: 12px;
        }

        /* =========================
           後台
        ========================= */

        #dashboard {
            display: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .top-bar h2 {
            margin-bottom: 5px;
        }

        .logout-btn {
            background: #777;
            color: white;
        }

        /* =========================
           年級
        ========================= */

        .grade-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .grade-btn {
            background: white;
            border: 2px solid #d5dce5;
        }

        .grade-btn.active {
            background: #1e3a5f;
            color: white;
            border-color: #1e3a5f;
        }

        /* =========================
           搜尋
        ========================= */

        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-area input {
            margin: 0;
        }

        .add-btn {
            background: #2d8a57;
            color: white;
            white-space: nowrap;
        }

        /* =========================
           學生卡片
        ========================= */

        #studentList {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(280px, 1fr)
            );
            gap: 18px;
        }

        .student-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .student-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .student-info {
            color: #777;
            margin-bottom: 15px;
        }

        .miles {
            font-size: 28px;
            font-weight: bold;
            color: #1e5d91;
            margin-bottom: 5px;
        }

        .tickets {
            margin-bottom: 15px;
            color: #555;
        }

        .card-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .plus-btn {
            background: #4caf50;
            color: white;
        }

        .minus-btn {
            background: #e57373;
            color: white;
        }

        .draw-btn {
            background: #f0a500;
            color: white;
        }

        .history-btn {
            background: #607d8b;
            color: white;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
            grid-column: 1 / -1;
        }

        /* =========================
           Modal
        ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,0.45);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 16px;
            padding: 25px;
        }

        .modal-content h3 {
            margin-top: 0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .cancel-btn {
            background: #ddd;
        }

        .confirm-btn {
            background: #1e3a5f;
            color: white;
        }

        .add-student-info {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        /* =========================
           歷史紀錄
        ========================= */

        .history-list {
            margin-top: 15px;
        }

        .history-item {
            border: 1px solid #e1e5ea;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            background: #f8fafc;
        }

        .history-time {
            font-size: 13px;
            color: #888;
            margin-bottom: 5px;
        }

        .history-action {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .history-change {
            font-size: 18px;
            font-weight: bold;
        }

        .history-remaining {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        .history-plus {
            color: #2d8a57;
        }

        .history-minus {
            color: #d9534f;
        }

        .history-draw {
            color: #e08a00;
        }

        .no-history {
            text-align: center;
            color: #888;
            padding: 25px 10px;
        }
    </style>
</head>

<body>

<header>

    <h1>✈️ Lucky Flight</h1>

    <p>
        👩‍🏫 教師智慧座艙
    </p>

</header>


<!-- =========================
     教師登入
========================= -->

<section id="loginSection">

    <h2>教師登入</h2>

    <input
        type="email"
        id="email"
        placeholder="電子郵件地址"
    >

    <input
        type="password"
        id="password"
        placeholder="密碼"
    >

    <button id="loginBtn">
        登入
    </button>

    <div id="loginMessage"></div>

</section>


<!-- =========================
     教師後台
========================= -->

<div id="dashboard">

    <div class="container">

        <div class="top-bar">

            <div>

                <h2>
                    教師智慧座艙
                </h2>

                <div id="teacherEmail"></div>

            </div>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                登出
            </button>

        </div>


        <!-- 年級 -->

        <div class="grade-buttons">

            <button
                class="grade-btn"
                data-grade="3"
            >
                三年級
            </button>

            <button
                class="grade-btn"
                data-grade="4"
            >
                四年級
            </button>

            <button
                class="grade-btn"
                data-grade="6"
            >
                六年級
            </button>

        </div>


        <!-- 搜尋 -->

        <div class="search-area">

            <input
                type="text"
                id="searchInput"
                placeholder="搜尋學生姓名或座號"
            >

            <button
                class="add-btn"
                id="addStudentBtn"
            >
                ＋ 新增學生
            </button>

        </div>


        <!-- 學生列表 -->

        <div id="studentList">

            <div class="loading">
                正在讀取學生資料……
            </div>

        </div>

    </div>

</div>


<!-- =========================
     Miles Modal
========================= -->

<div
    class="modal"
    id="milesModal"
>

    <div class="modal-content">

        <h3 id="milesModalTitle">
            增加 Miles
        </h3>

        <input
            type="number"
            id="milesInput"
            placeholder="請輸入 Miles"
            min="1"
        >

        <div class="modal-buttons">

            <button
                class="cancel-btn"
                id="cancelMilesBtn"
            >
                取消
            </button>

            <button
                class="confirm-btn"
                id="confirmMilesBtn"
            >
                確定
            </button>

        </div>

    </div>

</div>


<!-- =========================
     新增學生 Modal
========================= -->

<div
    class="modal"
    id="addStudentModal"
>

    <div class="modal-content">

        <h3>
            ＋ 新增學生
        </h3>

        <div class="add-student-info">
            新增後 Miles 將從 0 開始。
        </div>

        <input
            type="text"
            id="newStudentId"
            placeholder="座號，例如：01"
        >

        <input
            type="text"
            id="newStudentName"
            placeholder="學生姓名"
        >

        <select id="newStudentGrade">

            <option value="3">
                三年級
            </option>

            <option value="4">
                四年級
            </option>

            <option value="6">
                六年級
            </option>

        </select>

        <div class="modal-buttons">

            <button
                class="cancel-btn"
                id="cancelAddStudentBtn"
            >
                取消
            </button>

            <button
                class="confirm-btn"
                id="confirmAddStudentBtn"
            >
                建立學生
            </button>

        </div>

    </div>

</div>


<!-- =========================
     歷史紀錄 Modal
========================= -->

<div
    class="modal"
    id="historyModal"
>

    <div class="modal-content">

        <h3 id="historyModalTitle">
            📋 Miles 紀錄
        </h3>

        <div
            class="history-list"
            id="historyList"
        >
        </div>

        <div class="modal-buttons">

            <button
                class="cancel-btn"
                id="closeHistoryBtn"
            >
                關閉
            </button>

        </div>

    </div>

</div>


<!-- =========================
     Firebase
========================= -->

<script type="module">

    /* =========================
       Firebase App
    ========================= */

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    /* =========================
       Authentication
    ========================= */

    import {
        getAuth,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =========================
       Firestore
    ========================= */

    import {
        getFirestore,
        collection,
        getDocs,
        addDoc,
        doc,
        updateDoc,
        increment,
        arrayUnion,
        Timestamp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       Firebase 設定
    ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCF5oYAL83XW2Fa5hvdMYduKFj2gvDv1zA",

        authDomain:
            "lucke-flight.firebaseapp.com",

        projectId:
            "lucke-flight",

        storageBucket:
            "lucke-flight.firebasestorage.app",

        messagingSenderId:
            "682813117774",

        appId:
            "1:682813117774:web:ff379b46474d755d513a1f",

        measurementId:
            "G-45JZ9WENH9"

    };


    /* =========================
       初始化 Firebase
    ========================= */

    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    /* =========================
       網站變數
    ========================= */

    let students = [];

    let currentGrade = 3;

    let currentSearch = "";

    let selectedStudent = null;

    let milesMode = "plus";


    /* =========================
       DOM
    ========================= */

    const loginSection =
        document.getElementById(
            "loginSection"
        );


    const dashboard =
        document.getElementById(
            "dashboard"
        );


    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    const logoutBtn =
        document.getElementById(
            "logoutBtn"
        );


    const loginMessage =
        document.getElementById(
            "loginMessage"
        );


    const teacherEmail =
        document.getElementById(
            "teacherEmail"
        );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const studentList =
        document.getElementById(
            "studentList"
        );


    /* =========================
       Miles Modal
    ========================= */

    const milesModal =
        document.getElementById(
            "milesModal"
        );


    const milesInput =
        document.getElementById(
            "milesInput"
        );


    const confirmMilesBtn =
        document.getElementById(
            "confirmMilesBtn"
        );


    const cancelMilesBtn =
        document.getElementById(
            "cancelMilesBtn"
        );


    /* =========================
       新增學生 Modal
    ========================= */

    const addStudentModal =
        document.getElementById(
            "addStudentModal"
        );


    const addStudentBtn =
        document.getElementById(
            "addStudentBtn"
        );


    const cancelAddStudentBtn =
        document.getElementById(
            "cancelAddStudentBtn"
        );


    const confirmAddStudentBtn =
        document.getElementById(
            "confirmAddStudentBtn"
        );


    const newStudentId =
        document.getElementById(
            "newStudentId"
        );


    const newStudentName =
        document.getElementById(
            "newStudentName"
        );


    const newStudentGrade =
        document.getElementById(
            "newStudentGrade"
        );


    /* =========================
       歷史紀錄 Modal
    ========================= */

    const historyModal =
        document.getElementById(
            "historyModal"
        );


    const historyModalTitle =
        document.getElementById(
            "historyModalTitle"
        );


    const historyList =
        document.getElementById(
            "historyList"
        );


    const closeHistoryBtn =
        document.getElementById(
            "closeHistoryBtn"
        );


    /* =====================================================
       登入
    ===================================================== */

    loginBtn.addEventListener(
        "click",
        async () => {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            if (
                !email ||
                !password
            ) {

                loginMessage.textContent =
                    "請輸入電子郵件與密碼。";

                return;

            }


            try {

                loginMessage.textContent =
                    "登入中……";


                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                loginMessage.textContent =
                    "";


            }
            catch (error) {

                console.error(
                    "登入錯誤：",
                    error
                );


                loginMessage.textContent =
                    "登入失敗，請確認電子郵件與密碼。";

            }

        }
    );


    /* =====================================================
       登出
    ===================================================== */

    logoutBtn.addEventListener(
        "click",
        async () => {

            await signOut(auth);

        }
    );


    /* =====================================================
       Firebase 登入狀態
    ===================================================== */

    onAuthStateChanged(
        auth,
        async user => {

            if (user) {

                loginSection.style.display =
                    "none";


                dashboard.style.display =
                    "block";


                teacherEmail.textContent =
                    "目前登入：" +
                    user.email;


                await loadStudentsFromFirestore();

            }
            else {

                loginSection.style.display =
                    "block";


                dashboard.style.display =
                    "none";

            }

        }
    );


    /* =====================================================
       讀取學生
    ===================================================== */

    async function loadStudentsFromFirestore() {

        studentList.innerHTML = `

            <div class="loading">

                正在從 Firebase
                讀取學生資料……

            </div>

        `;


        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "students"
                    )
                );


            students =
                snapshot.docs.map(
                    docSnap => {

                        const data =
                            docSnap.data();


                        return {

                            firestoreId:
                                docSnap.id,

                            id:
                                data.studentId,

                            name:
                                data.name,

                            grade:
                                data.grade,

                            miles:
                                data.miles || 0,

                            history:
                                data.history || []

                        };

                    }
                );


            console.log(
                "Firestore 學生資料：",
                students
            );


            renderStudents();


        }
        catch (error) {

            console.error(
                "Firestore 讀取錯誤：",
                error
            );


            studentList.innerHTML = `

                <div class="empty">

                    ❌ 讀取 Firestore
                    學生資料失敗

                </div>

            `;

        }

    }


    /* =====================================================
       年級切換
    ===================================================== */

    document
        .querySelectorAll(".grade-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    currentGrade =
                        Number(
                            button.dataset.grade
                        );


                    document
                        .querySelectorAll(
                            ".grade-btn"
                        )
                        .forEach(btn => {

                            btn.classList.remove(
                                "active"
                            );

                        });


                    button.classList.add(
                        "active"
                    );


                    renderStudents();

                }
            );

        });


    /* =====================================================
       搜尋
    ===================================================== */

    searchInput.addEventListener(
        "input",
        () => {

            currentSearch =
                searchInput.value
                    .trim()
                    .toLowerCase();


            renderStudents();

        }
    );


    /* =====================================================
       抽獎 Miles
    ===================================================== */

    function getDrawCost(grade) {

        return Number(grade) === 6
            ? 80
            : 30;

    }


    /* =====================================================
       顯示學生
    ===================================================== */

    function renderStudents() {

        const filteredStudents =
            students.filter(
                student => {

                    const sameGrade =
                        Number(
                            student.grade
                        ) ===
                        currentGrade;


                    const keyword =
                        currentSearch;


                    const matchSearch =
                        !keyword ||

                        String(
                            student.id || ""
                        )
                        .toLowerCase()
                        .includes(
                            keyword
                        ) ||

                        String(
                            student.name || ""
                        )
                        .toLowerCase()
                        .includes(
                            keyword
                        );


                    return (
                        sameGrade &&
                        matchSearch
                    );

                }
            );


        if (
            filteredStudents.length === 0
        ) {

            studentList.innerHTML = `

                <div class="empty">

                    目前沒有符合條件的學生。

                </div>

            `;

            return;

        }


        studentList.innerHTML =
            filteredStudents
                .map(
                    student => {

                        const drawCost =
                            getDrawCost(
                                student.grade
                            );


                        const tickets =
                            Math.floor(
                                student.miles /
                                drawCost
                            );


                        return `

                            <div
                                class="student-card"
                            >

                                <div
                                    class="student-name"
                                >
                                    ${student.name}
                                </div>


                                <div
                                    class="student-info"
                                >
                                    座號：
                                    ${student.id}
                                </div>


                                <div
                                    class="miles"
                                >
                                    ${student.miles}
                                    Miles
                                </div>


                                <div
                                    class="tickets"
                                >
                                    🎫 可抽獎
                                    ${tickets}
                                    次
                                </div>


                                <div
                                    class="card-buttons"
                                >

                                    <button
                                        class="plus-btn"
                                        data-action="plus"
                                        data-id="${student.firestoreId}"
                                    >
                                        ＋ Miles
                                    </button>


                                    <button
                                        class="minus-btn"
                                        data-action="minus"
                                        data-id="${student.firestoreId}"
                                    >
                                        − Miles
                                    </button>


                                    <button
                                        class="draw-btn"
                                        data-action="draw"
                                        data-id="${student.firestoreId}"
                                    >
                                        🎫 使用一次
                                    </button>


                                    <button
                                        class="history-btn"
                                        data-action="history"
                                        data-id="${student.firestoreId}"
                                    >
                                        📋 紀錄
                                    </button>

                                </div>

                            </div>

                        `;

                    }
                )
                .join("");


        studentList
            .querySelectorAll("button")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const action =
                            button.dataset.action;


                        const firestoreId =
                            button.dataset.id;


                        if (
                            action === "plus"
                        ) {

                            openMilesModal(
                                firestoreId,
                                "plus"
                            );

                        }

                        else if (
                            action === "minus"
                        ) {

                            openMilesModal(
                                firestoreId,
                                "minus"
                            );

                        }

                        else if (
                            action === "draw"
                        ) {

                            useOneDraw(
                                firestoreId
                            );

                        }

                        else if (
                            action === "history"
                        ) {

                            showHistory(
                                firestoreId
                            );

                        }

                    }
                );

            });

    }


    /* =====================================================
       Miles Modal
    ===================================================== */

    function openMilesModal(
        firestoreId,
        mode
    ) {

        selectedStudent =
            students.find(
                student =>
                    student.firestoreId ===
                    firestoreId
            );


        if (
            !selectedStudent
        ) {

            return;

        }


        milesMode =
            mode;


        if (
            mode === "plus"
        ) {

            document.getElementById(
                "milesModalTitle"
            ).textContent =
                `增加 Miles｜${selectedStudent.name}`;

        }
        else {

            document.getElementById(
                "milesModalTitle"
            ).textContent =
                `扣除 Miles｜${selectedStudent.name}`;

        }


        milesInput.value =
            "";


        milesModal.style.display =
            "flex";


        milesInput.focus();

    }


    /* =====================================================
       關閉 Miles Modal
    ===================================================== */

    cancelMilesBtn.addEventListener(
        "click",
        () => {

            milesModal.style.display =
                "none";


            selectedStudent =
                null;

        }
    );


    /* =====================================================
       增加／扣除 Miles
    ===================================================== */

    confirmMilesBtn.addEventListener(
        "click",
        async () => {

            if (
                !selectedStudent
            ) {

                return;

            }


            const amount =
                Number(
                    milesInput.value
                );


            if (
                !Number.isFinite(
                    amount
                ) ||
                amount <= 0
            ) {

                alert(
                    "請輸入大於 0 的 Miles。"
                );

                return;

            }


            if (
                milesMode === "minus" &&
                amount >
                    selectedStudent.miles
            ) {

                alert(

                    `目前只有 ${selectedStudent.miles} Miles，` +
                    `無法扣除 ${amount} Miles。`

                );

                return;

            }


            try {

                confirmMilesBtn.disabled =
                    true;


                confirmMilesBtn.textContent =
                    "儲存中……";


                const studentRef =
                    doc(
                        db,
                        "students",
                        selectedStudent.firestoreId
                    );


                const change =
                    milesMode === "plus"
                        ? amount
                        : -amount;


                const newMiles =
                    selectedStudent.miles +
                    change;


                const historyRecord = {

                    time:
                        Timestamp.now(),

                    action:
                        milesMode === "plus"
                            ? "增加 Miles"
                            : "扣除 Miles",

                    change:
                        change,

                    milesAfter:
                        newMiles

                };


                await updateDoc(
                    studentRef,
                    {

                        miles:
                            increment(
                                change
                            ),

                        history:
                            arrayUnion(
                                historyRecord
                            )

                    }
                );


                milesModal.style.display =
                    "none";


                selectedStudent =
                    null;


                await loadStudentsFromFirestore();


                alert(
                    "✅ Miles 已成功更新！"
                );


            }
            catch (error) {

                console.error(
                    "Miles 更新失敗：",
                    error
                );


                alert(
                    "❌ Miles 更新失敗，請查看瀏覽器主控台。"
                );

            }
            finally {

                confirmMilesBtn.disabled =
                    false;


                confirmMilesBtn.textContent =
                    "確定";

            }

        }
    );


    /* =====================================================
       使用一次抽獎
    ===================================================== */

    async function useOneDraw(
        firestoreId
    ) {

        const student =
            students.find(
                item =>
                    item.firestoreId ===
                    firestoreId
            );


        if (
            !student
        ) {

            return;

        }


        const drawCost =
            getDrawCost(
                student.grade
            );


        if (
            student.miles <
            drawCost
        ) {

            alert(

                `Miles 不足！\n\n` +
                `${student.name} 目前有 ${student.miles} Miles。\n` +
                `本次需要 ${drawCost} Miles。`

            );

            return;

        }


        const confirmed =
            confirm(

                `確定要讓 ${student.name} 使用一次抽獎資格嗎？\n\n` +
                `將扣除 ${drawCost} Miles。\n` +
                `目前：${student.miles} Miles\n` +
                `使用後：${student.miles - drawCost} Miles`

            );


        if (
            !confirmed
        ) {

            return;

        }


        try {

            const studentRef =
                doc(
                    db,
                    "students",
                    student.firestoreId
                );


            const newMiles =
                student.miles -
                drawCost;


            const historyRecord = {

                time:
                    Timestamp.now(),

                action:
                    "使用一次抽獎",

                change:
                    -drawCost,

                milesAfter:
                    newMiles

            };


            await updateDoc(
                studentRef,
                {

                    miles:
                        increment(
                            -drawCost
                        ),

                    history:
                        arrayUnion(
                            historyRecord
                        )

                }
            );


            await loadStudentsFromFirestore();


            alert(

                `🎫 抽獎資格使用成功！\n\n` +
                `已扣除 ${drawCost} Miles。`

            );


        }
        catch (error) {

            console.error(
                "使用抽獎資格失敗：",
                error
            );


            alert(
                "❌ 使用抽獎資格失敗，請查看瀏覽器主控台。"
            );

        }

    }


    /* =====================================================
       新增學生
    ===================================================== */

    addStudentBtn.addEventListener(
        "click",
        () => {

            newStudentId.value =
                "";


            newStudentName.value =
                "";


            newStudentGrade.value =
                String(
                    currentGrade
                );


            addStudentModal.style.display =
                "flex";


            newStudentId.focus();

        }
    );


    /* =====================================================
       關閉新增學生
    ===================================================== */

    cancelAddStudentBtn.addEventListener(
        "click",
        () => {

            addStudentModal.style.display =
                "none";

        }
    );


    /* =====================================================
       建立學生
    ===================================================== */

    confirmAddStudentBtn.addEventListener(
        "click",
        async () => {

            const studentId =
                newStudentId.value
                    .trim();


            const studentName =
                newStudentName.value
                    .trim();


            const studentGrade =
                Number(
                    newStudentGrade.value
                );


            if (
                !studentId
            ) {

                alert(
                    "請輸入學生座號。"
                );

                newStudentId.focus();

                return;

            }


            if (
                !studentName
            ) {

                alert(
                    "請輸入學生姓名。"
                );

                newStudentName.focus();

                return;

            }


            if (
                ![3, 4, 6]
                    .includes(
                        studentGrade
                    )
            ) {

                alert(
                    "請選擇三、四或六年級。"
                );

                return;

            }


            const duplicate =
                students.find(
                    student =>

                        Number(
                            student.grade
                        ) ===
                        studentGrade &&

                        String(
                            student.id
                        )
                        .trim() ===
                        studentId

                );


            if (
                duplicate
            ) {

                alert(

                    `⚠️ ${studentGrade} 年級已經有座號 ${studentId} 的學生。\n\n` +
                    `學生姓名：${duplicate.name}`

                );

                return;

            }


            try {

                confirmAddStudentBtn.disabled =
                    true;


                confirmAddStudentBtn.textContent =
                    "建立中……";


                await addDoc(
                    collection(
                        db,
                        "students"
                    ),
                    {

                        studentId:
                            studentId,

                        name:
                            studentName,

                        grade:
                            studentGrade,

                        miles:
                            0,

                        history:
                            []

                    }
                );


                addStudentModal.style.display =
                    "none";


                await loadStudentsFromFirestore();


                if (
                    currentGrade !==
                    studentGrade
                ) {

                    currentGrade =
                        studentGrade;


                    document
                        .querySelectorAll(
                            ".grade-btn"
                        )
                        .forEach(btn => {

                            btn.classList.remove(
                                "active"
                            );

                        });


                    const targetButton =
                        document.querySelector(
                            `[data-grade="${studentGrade}"]`
                        );


                    if (
                        targetButton
                    ) {

                        targetButton.classList.add(
                            "active"
                        );

                    }


                    renderStudents();

                }


                alert(

                    `✅ 學生新增成功！\n\n` +
                    `座號：${studentId}\n` +
                    `姓名：${studentName}\n` +
                    `年級：${studentGrade} 年級\n` +
                    `Miles：0`

                );

            }
            catch (error) {

                console.error(
                    "新增學生失敗：",
                    error
                );


                alert(
                    "❌ 新增學生失敗，請查看瀏覽器主控台。"
                );

            }
            finally {

                confirmAddStudentBtn.disabled =
                    false;


                confirmAddStudentBtn.textContent =
                    "建立學生";

            }

        }
    );


    /* =====================================================
       顯示歷史紀錄
    ===================================================== */

    function showHistory(
        firestoreId
    ) {

        const student =
            students.find(
                item =>
                    item.firestoreId ===
                    firestoreId
            );


        if (
            !student
        ) {

            return;

        }


        historyModalTitle.textContent =
            `📋 Miles 紀錄｜${student.name}`;


        const history =
            Array.isArray(
                student.history
            )
                ? [...student.history]
                : [];


        /*
         * 最新紀錄放最上面
         */

        history.sort(
            (a, b) => {

                const timeA =
                    getHistoryTime(
                        a
                    );


                const timeB =
                    getHistoryTime(
                        b
                    );


                return (
                    timeB -
                    timeA
                );

            }
        );


        if (
            history.length === 0
        ) {

            historyList.innerHTML = `

                <div class="no-history">

                    目前還沒有 Miles 紀錄。

                </div>

            `;

        }
        else {

            historyList.innerHTML =
                history
                    .map(
                        record => {

                            const date =
                                formatHistoryTime(
                                    record.time
                                );


                            const change =
                                Number(
                                    record.change || 0
                                );


                            let actionClass =
                                "history-plus";


                            if (
                                record.action ===
                                "使用一次抽獎"
                            ) {

                                actionClass =
                                    "history-draw";

                            }
                            else if (
                                change < 0
                            ) {

                                actionClass =
                                    "history-minus";

                            }


                            const changeText =
                                change > 0
                                    ? `+${change} Miles`
                                    : `${change} Miles`;


                            return `

                                <div
                                    class="history-item"
                                >

                                    <div
                                        class="history-time"
                                    >
                                        ${date}
                                    </div>


                                    <div
                                        class="history-action"
                                    >
                                        ${record.action || "Miles 異動"}
                                    </div>


                                    <div
                                        class="history-change ${actionClass}"
                                    >
                                        ${changeText}
                                    </div>


                                    <div
                                        class="history-remaining"
                                    >
                                        剩餘：
                                        ${record.milesAfter ?? "-"}
                                        Miles
                                    </div>

                                </div>

                            `;

                        }
                    )
                    .join("");

        }


        historyModal.style.display =
            "flex";

    }


    /* =====================================================
       取得歷史紀錄時間
    ===================================================== */

    function getHistoryTime(
        time
    ) {

        if (
            time &&
            typeof time.toMillis ===
                "function"
        ) {

            return time.toMillis();

        }


        if (
            time &&
            typeof time.seconds ===
                "number"
        ) {

            return (
                time.seconds *
                1000
            );

        }


        return 0;

    }


    /* =====================================================
       格式化歷史紀錄時間
    ===================================================== */

    function formatHistoryTime(
        time
    ) {

        let date;


        if (
            time &&
            typeof time.toDate ===
                "function"
        ) {

            date =
                time.toDate();

        }
        else if (
            time &&
            typeof time.seconds ===
                "number"
        ) {

            date =
                new Date(
                    time.seconds *
                    1000
                );

        }
        else {

            return "時間不明";

        }


        return date.toLocaleString(
            "zh-TW",
            {
                year: "numeric",
                month: "numeric",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /* =====================================================
       關閉歷史紀錄
    ===================================================== */

    closeHistoryBtn.addEventListener(
        "click",
        () => {

            historyModal.style.display =
                "none";

        }
    );


    /* =====================================================
       初始年級
    ===================================================== */

    document
        .querySelector(
            '[data-grade="3"]'
        )
        .classList.add(
            "active"
        );

</script>
